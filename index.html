<html>
	<head>
    	<meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A fun Black-Jack game built with HTML, CSS and Javescript">
        <meta name="author" content="Fakhar E Alam">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
    	<div class="main">
        	<div class="section1">
              <h1 id="title">BLACKJACK</h1>
              <div class="text">
                  <h2 id="message-el">Press START GAME to draw cards!</h2>
                  <h2>Cards:<span id="cards-el"></span></h2>
                  <h2>Sum:<span id="sum-el"></span></h2>
              </div>
              <div class="btnz">
                  <button id="start-btn" onclick="start()">START GAME</button>
                  <button id="newCard-btn" onclick="newCard()">NEW CARD</button>
              </div>
        	</div>
            <div class="name-cash">
            	<p><span id="name">Player name</span> : $ <span id="cash">Cash</span></p>
        	</div>
            <div class="text-bottom">
            	<p>---  <span id="msg-bottom"></span>  ---</p>
        	</div>
        </div>
        <script src="node.js"></script>
    </body>
</html>
